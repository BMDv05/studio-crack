services:
  db:
    image: postgres:16-alpine
    container_name: doubleh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doubleh
      POSTGRES_PASSWORD: doubleh
      POSTGRES_DB: doubleh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doubleh -d doubleh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
